<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="robots" content="noindex" />
  <title>오늘의 영어</title>
  <script>
    // Always load the current code: iPad Safari can keep old copies of these files for a long time,
    // so each file gets a fresh ?v= on every visit (app modules via an import map).
    (function () {
      var v = Date.now();
      document.write('<link rel="stylesheet" href="style.css?v=' + v + '" />');
      var imports = {};
      ["db.js", "planner.js", "memory.js"].forEach(function (f) {
        imports[new URL(f, location.href).href] = "./" + f + "?v=" + v;
      });
      if (HTMLScriptElement.supports && HTMLScriptElement.supports("importmap")) {
        var m = document.createElement("script");
        m.type = "importmap";
        m.textContent = JSON.stringify({ imports: imports });
        document.head.appendChild(m);
      }
      window.__v = v;
    })();
  </script>
</head>
<body>
  <main id="app"></main>
  <script src="config.js"></script>
  <script>
    var s = document.createElement("script");
    s.type = "module";
    s.src = "app.js?v=" + window.__v;
    document.body.appendChild(s);
  </script>
</body>
</html>
