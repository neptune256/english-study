<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>학습 대시보드</title>
  <script>
    // Always load the current code (no stale cached copies): fresh ?v= on every visit.
    (function () {
      var v = Date.now();
      document.write('<link rel="stylesheet" href="style.css?v=' + v + '" />');
      var imports = {};
      ["db.js", "planner.js", "memory.js"].forEach(function (f) {
        imports[new URL(f, location.href).href] = "./" + f + "?v=" + v;
      });
      if (HTMLScriptElement.supports && HTMLScriptElement.supports("importmap")) {
        var m = document.createElement("script");
        m.type = "importmap";
        m.textContent = JSON.stringify({ imports: imports });
        document.head.appendChild(m);
      }
      window.__v = v;
    })();
  </script>
  <style>
    #app { max-width: 1100px; }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 18px; }
    .kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
    .kpi .v { font-size: 28px; font-weight: 700; }
    .kpi .l { color: var(--muted); font-size: 14px; }
    .kpi.warn { border-color: var(--bad); }
    h2 { font-size: 20px; margin: 26px 0 10px; }
    .tbl-wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
    table { border-collapse: collapse; width: 100%; font-size: 15px; }
    th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; white-space: nowrap; }
    tr.click { cursor: pointer; }
    tr.click:hover, tr.sel { background: var(--accent-soft); }
    .ox { font-weight: 700; }
    .o { color: var(--good); } .x { color: var(--bad); }
    .pill { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--line); margin-left: 4px; }
    .pill.warn { background: var(--bad-soft); color: var(--bad); }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 760px) { .two { grid-template-columns: 1fr; } }
    .bar-cell { display: flex; align-items: center; gap: 8px; }
    .bar-bg { flex: 1; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; min-width: 60px; }
    .bar-fg { height: 100%; background: var(--accent); }
    details.p { border-top: 1px solid var(--line); padding: 10px 0; }
    details.p summary { cursor: pointer; font-weight: 600; }
    .pbody { font-family: "Times New Roman", Georgia, serif; white-space: pre-wrap; font-size: 16px; margin: 8px 0; }
    /* word mastery */
    :root { --lv-fading: var(--bad); --lv-due: #d4891c; --lv-fresh: var(--accent); --lv-solid: var(--good); --lv-mastered: #8a6cf0; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .chip { font: inherit; font-size: 14px; border: 1.5px solid var(--line); background: var(--card); color: var(--text); border-radius: 99px; padding: 5px 12px; cursor: pointer; }
    .chip.on { border-color: var(--text); font-weight: 700; }
    .chip.lv-fading { border-left: 6px solid var(--lv-fading); } .chip.lv-due { border-left: 6px solid var(--lv-due); }
    .chip.lv-fresh { border-left: 6px solid var(--lv-fresh); } .chip.lv-solid { border-left: 6px solid var(--lv-solid); }
    .chip.lv-mastered { border-left: 6px solid var(--lv-mastered); }
    .bar-fg.lv-fading { background: var(--lv-fading); } .bar-fg.lv-due { background: var(--lv-due); }
    .bar-fg.lv-fresh { background: var(--lv-fresh); } .bar-fg.lv-solid { background: var(--lv-solid); }
    .bar-fg.lv-mastered { background: var(--lv-mastered); }
    .pill.lv-fading { background: var(--bad-soft); color: var(--lv-fading); } .pill.lv-due { color: var(--lv-due); }
    .pill.lv-fresh { background: var(--accent-soft); color: var(--lv-fresh); } .pill.lv-solid { background: var(--good-soft); color: var(--lv-solid); }
    .pill.lv-mastered { color: var(--lv-mastered); }
    .pill { white-space: nowrap; }
    .alert { background: var(--bad-soft); color: var(--text); border: 1.5px solid var(--bad); border-radius: var(--radius); padding: 12px 16px; margin-bottom: 16px; }
    .stock { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 10px; }
    .band { display: grid; grid-template-columns: 110px 1fr 28px; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 8px; font-size: 14px; }
    .band.here { background: var(--accent-soft); font-weight: 700; }
    .types { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .tag-re { font-size: 12px; color: var(--accent); margin-left: 4px; }
    #mastery td { white-space: nowrap; }
    #mastery td.small { white-space: normal; min-width: 180px; }
    #mastery .bar-bg { min-width: 70px; }
    .forecast { padding: 14px 16px; }
    .fc-row { display: grid; grid-template-columns: repeat(14, 1fr); gap: 6px; margin-top: 8px; }
    .fc { text-align: center; font-size: 12px; }
    .fc-bar { height: 60px; display: flex; align-items: flex-end; background: var(--bg); border-radius: 4px; overflow: hidden; }
    .fc-bar div { width: 100%; background: var(--accent); }
    .fc-n { font-weight: 700; min-height: 1.2em; }
    .fc-d { color: var(--muted); }
    /* weekly test */
    .wk-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
    .wk-score { font-size: 34px; font-weight: 700; line-height: 1.2; }
    .wk-score .muted { font-size: 22px; }
    .wk-pct { font-size: 22px; color: var(--accent); margin: 0 6px; }
    .wk-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .wk-kinds { margin-bottom: 12px; max-width: 520px; }
    .print-sheet ol.pq { font-size: 16px; line-height: 2.4; padding-left: 28px; }
    .print-sheet .pq-key { page-break-before: always; margin-top: 30px; }
    .print-sheet .pq-key ol.pq { line-height: 1.8; }
    /* class handout (수업용 PDF) */
    .detail-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin: 26px 0 10px; }
    .detail-head h2 { margin: 0; }
    .class-sheet .print-bar { align-items: center; flex-wrap: wrap; }
    .class-sheet .pc-title { font-size: 20px; margin: 14px 0 4px; }
    .class-sheet .pc-h { font-size: 17px; margin: 22px 0 8px; border-bottom: 2px solid #000; padding-bottom: 4px; }
    .class-sheet .pc-h3 { font-size: 15px; margin: 14px 0 6px; }
    .class-sheet .pw-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 14px; font-size: 14px; line-height: 1.4; }
    .class-sheet .pw { border-bottom: 1px solid #ddd; padding: 4px 0; break-inside: avoid; }
    .class-sheet .pw-pos { color: #666; font-size: 12px; }
    .class-sheet .pc-q { margin: 18px 0 26px; break-inside: avoid; page-break-inside: avoid; }
    .class-sheet .pc-qhead { margin-bottom: 8px; font-size: 15px; line-height: 1.5; }
    .class-sheet .pc-list { list-style: none; padding: 0; margin: 8px 0 0; font-size: 15px; line-height: 1.7; }
    .class-sheet .pc-n { display: inline-block; width: 1.4em; }
    .class-sheet .pc-row { display: flex; gap: 28px; font-size: 16px; margin-top: 8px; }
    .class-sheet .pc-key { page-break-before: always; break-before: page; margin-top: 30px; }
    .class-sheet .pc-sum { border-collapse: collapse; margin: 8px 0 18px; font-size: 14px; }
    .class-sheet .pc-sum th, .class-sheet .pc-sum td { border: 1px solid #999; padding: 4px 12px; text-align: center; color: #000; }
    .class-sheet .pc-a { margin: 0 0 16px; padding-bottom: 12px; border-bottom: 1px solid #ccc; font-size: 14px; line-height: 1.7; break-inside: avoid; }
    .class-sheet .pc-expl { margin-top: 4px; }
    @media print { .class-sheet .pw-grid { grid-template-columns: repeat(3, 1fr); } }
    /* grammar lesson (어법 수업) in the class handout */
    .class-sheet .gl-page { page-break-before: always; break-before: page; }
    .class-sheet .gl { margin: 6px 0 20px; }
    .class-sheet .gl-title { font-size: 17px; margin: 6px 0 8px; }
    .class-sheet .gl-key { border: 1.5px solid #000; padding: 8px 12px; font-size: 15px; line-height: 1.6; font-weight: 600; }
    .class-sheet .gl-h { font-weight: 700; font-size: 14px; margin: 12px 0 4px; border-left: 4px solid #000; padding-left: 6px; }
    .class-sheet .gl-list { margin: 4px 0; padding-left: 22px; font-size: 14px; line-height: 1.7; }
    .class-sheet .gl-ex { margin: 4px 0; padding-left: 18px; font-size: 15px; line-height: 1.6; font-family: "Times New Roman", Georgia, serif; }
    .class-sheet .gl-ex li { margin-bottom: 6px; }
    .class-sheet .gl-ex .pg { font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
    .class-sheet .gx { color: #777; }
    .class-sheet .go { text-decoration: underline; }
    .class-sheet .gl-steps { font-size: 14px; line-height: 1.7; }
    .class-sheet .gl-practice { padding-left: 22px; font-size: 15px; line-height: 2.2; font-family: "Times New Roman", Georgia, serif; }
    /* homework check */
    :root { --hw-part: #d4891c; --hw-part-soft: #fbf0dc; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --hw-part: #f0b25a; --hw-part-soft: #3a2e17; } }
    .hw-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 12px; }
    @media (max-width: 760px) { .hw-grid { grid-template-columns: 1fr; } }
    .hw-card { background: var(--card); border: 1px solid var(--line); border-top: 6px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
    .hw-card.hw-done { border-top-color: var(--good); }
    .hw-card.hw-part { border-top-color: var(--hw-part); }
    .hw-card.hw-none { border-top-color: var(--bad); }
    .hw-card.hw-wait { border-top-color: var(--accent); }
    .hw-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
    .hw-title { font-size: 20px; font-weight: 700; }
    .hw-badge { font-size: 18px; font-weight: 700; padding: 4px 12px; border-radius: 99px; white-space: nowrap; background: var(--line); }
    .hw-done .hw-badge { background: var(--good-soft); color: var(--good); }
    .hw-part .hw-badge { background: var(--hw-part-soft); color: var(--hw-part); }
    .hw-none .hw-badge { background: var(--bad-soft); color: var(--bad); }
    .hw-wait .hw-badge { background: var(--accent-soft); color: var(--accent); }
    .hw-parts { list-style: none; padding: 0; margin: 0 0 8px; display: grid; gap: 4px; }
    .hw-parts li { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px; font-size: 16px; }
    .hw-parts li.ok { background: var(--good-soft); }
    .hw-parts li.half { background: var(--hw-part-soft); }
    .hw-parts li.no { background: var(--bad-soft); }
    .hw-parts li.todo { background: var(--bg); color: var(--muted); }
    .hw-mk { width: 1.2em; font-weight: 700; text-align: center; }
    li.ok .hw-mk { color: var(--good); } li.half .hw-mk { color: var(--hw-part); } li.no .hw-mk { color: var(--bad); }
    .hw-name { flex: 1; }
    .hw-num { font-weight: 600; }
    .hw-parts .btn { min-height: 0; padding: 4px 10px; font-size: 13px; }
    .hw-strip-head { margin: 4px 0 6px; }
    .hw-strip { display: grid; grid-template-columns: repeat(14, minmax(40px, 1fr)); gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 8px; }
    .hw-dot { font: inherit; display: grid; justify-items: center; gap: 1px; padding: 6px 0; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--muted); cursor: default; }
    .hw-dot[data-day] { cursor: pointer; }
    .hw-dm { font-size: 18px; font-weight: 700; }
    .hw-dd { font-size: 12px; } .hw-dw { font-size: 11px; }
    .hw-dot.hw-done { background: var(--good-soft); border-color: var(--good); } .hw-dot.hw-done .hw-dm { color: var(--good); }
    .hw-dot.hw-part { background: var(--hw-part-soft); border-color: var(--hw-part); } .hw-dot.hw-part .hw-dm { color: var(--hw-part); }
    .hw-dot.hw-none .hw-dm { color: var(--bad); }
    .hw-dot.hw-pre { opacity: 0.45; }
    .hw-dot.hw-wait { border-color: var(--accent); } .hw-dot.hw-wait .hw-dm { color: var(--accent); }
  </style>
</head>
<body>
  <main id="app"><div class="center muted">불러오는 중…</div></main>
  <script src="config.js"></script>
  <script>
    var s = document.createElement("script");
    s.type = "module";
    s.src = "teacher.js?v=" + window.__v;
    document.body.appendChild(s);
  </script>
</body>
</html>
