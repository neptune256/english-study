<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>학습 대시보드</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    #app { max-width: 1100px; }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 18px; }
    .kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
    .kpi .v { font-size: 28px; font-weight: 700; }
    .kpi .l { color: var(--muted); font-size: 14px; }
    .kpi.warn { border-color: var(--bad); }
    h2 { font-size: 20px; margin: 26px 0 10px; }
    .tbl-wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
    table { border-collapse: collapse; width: 100%; font-size: 15px; }
    th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; white-space: nowrap; }
    tr.click { cursor: pointer; }
    tr.click:hover, tr.sel { background: var(--accent-soft); }
    .ox { font-weight: 700; }
    .o { color: var(--good); } .x { color: var(--bad); }
    .pill { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--line); margin-left: 4px; }
    .pill.warn { background: var(--bad-soft); color: var(--bad); }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 760px) { .two { grid-template-columns: 1fr; } }
    .bar-cell { display: flex; align-items: center; gap: 8px; }
    .bar-bg { flex: 1; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; min-width: 60px; }
    .bar-fg { height: 100%; background: var(--accent); }
    details.p { border-top: 1px solid var(--line); padding: 10px 0; }
    details.p summary { cursor: pointer; font-weight: 600; }
    .pbody { font-family: "Times New Roman", Georgia, serif; white-space: pre-wrap; font-size: 16px; margin: 8px 0; }
    /* word mastery */
    :root { --lv-fading: var(--bad); --lv-due: #d4891c; --lv-fresh: var(--accent); --lv-solid: var(--good); --lv-mastered: #8a6cf0; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .chip { font: inherit; font-size: 14px; border: 1.5px solid var(--line); background: var(--card); color: var(--text); border-radius: 99px; padding: 5px 12px; cursor: pointer; }
    .chip.on { border-color: var(--text); font-weight: 700; }
    .chip.lv-fading { border-left: 6px solid var(--lv-fading); } .chip.lv-due { border-left: 6px solid var(--lv-due); }
    .chip.lv-fresh { border-left: 6px solid var(--lv-fresh); } .chip.lv-solid { border-left: 6px solid var(--lv-solid); }
    .chip.lv-mastered { border-left: 6px solid var(--lv-mastered); }
    .bar-fg.lv-fading { background: var(--lv-fading); } .bar-fg.lv-due { background: var(--lv-due); }
    .bar-fg.lv-fresh { background: var(--lv-fresh); } .bar-fg.lv-solid { background: var(--lv-solid); }
    .bar-fg.lv-mastered { background: var(--lv-mastered); }
    .pill.lv-fading { background: var(--bad-soft); color: var(--lv-fading); } .pill.lv-due { color: var(--lv-due); }
    .pill.lv-fresh { background: var(--accent-soft); color: var(--lv-fresh); } .pill.lv-solid { background: var(--good-soft); color: var(--lv-solid); }
    .pill.lv-mastered { color: var(--lv-mastered); }
    .pill { white-space: nowrap; }
    #mastery td { white-space: nowrap; }
    #mastery td.small { white-space: normal; min-width: 180px; }
    #mastery .bar-bg { min-width: 70px; }
    .forecast { padding: 14px 16px; }
    .fc-row { display: grid; grid-template-columns: repeat(14, 1fr); gap: 6px; margin-top: 8px; }
    .fc { text-align: center; font-size: 12px; }
    .fc-bar { height: 60px; display: flex; align-items: flex-end; background: var(--bg); border-radius: 4px; overflow: hidden; }
    .fc-bar div { width: 100%; background: var(--accent); }
    .fc-n { font-weight: 700; min-height: 1.2em; }
    .fc-d { color: var(--muted); }
  </style>
</head>
<body>
  <main id="app"><div class="center muted">불러오는 중…</div></main>
  <script src="config.js"></script>
  <script type="module" src="teacher.js"></script>
</body>
</html>
